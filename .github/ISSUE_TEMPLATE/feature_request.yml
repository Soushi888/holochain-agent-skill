name: Feature Request
description: Suggest a new domain, workflow, or piece of coverage for the skill.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. This skill covers the full Holochain development spiral (architecture, design, scaffolding, implementation, testing, deployment); ecosystem-expansion items (hREA, ADAM, Wind Tunnel, and similar) are tracked separately, so check `docs/roadmap.md` first to see if this is already planned.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What are you trying to do with the skill that it does not currently support well?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed addition or change
      description: What would you like added or changed? If this is new reference content, note whether it belongs in `references/workflows/` (a step-by-step sequence) or as reference material alongside the other `references/*.md` files.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other ways you considered solving this, and why you prefer this approach.

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Links, examples from other projects, or anything else useful.
